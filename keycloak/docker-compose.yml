services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    # start-dev : mode développement (HTTP, pas de clustering)
    # --import-realm : importe automatiquement les fichiers JSON de /opt/keycloak/data/import/
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8081:8080"   # Application Spring Boot → http://localhost:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/ticket-realm || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
